<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal du gérant</title>
<style>
:root{
  --bg:#0b0f14; --bg2:#10161d; --panel:#131a22; --panel2:#18212b; --line:#223040;
  --text:#e6edf3; --muted:#8b98a7; --dim:#5f6d7c; --accent:#5eb1ff; --accent2:#a78bfa;
  --up:#34d399; --down:#f87171; --warn:#fbbf24; --chip:#1c2632;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
a{color:var(--accent)}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;
  border-bottom:1px solid var(--line);background:var(--bg2)}
header h1{font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:0;font-weight:700}
header h1 span{color:var(--accent)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);
  border:1px solid var(--line);white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.spacer{flex:1}
nav{position:sticky;top:0;z-index:20;display:flex;gap:2px;overflow-x:auto;background:var(--bg2);
  border-bottom:1px solid var(--line);padding:0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--muted);padding:12px 14px;font:600 13px var(--sans);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
section{display:none} section.on{display:block}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
h2:first-child{margin-top:4px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.two{grid-template-columns:2fr 1fr} .half{grid-template-columns:1fr 1fr}
@media (max-width:900px){.two,.half{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:600 20px var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;
  letter-spacing:.02em;text-align:left;padding:8px 10px;cursor:pointer;white-space:nowrap;user-select:none}
th.n,td.n{text-align:right}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#1a2430}
.sym{font-weight:700;font-family:var(--mono)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:4px}
.tag.buy{background:#0f3b2c;color:var(--up)} .tag.sell{background:#3d1a1d;color:var(--down)}
.tag.niche{background:#33280d;color:var(--warn)} .tag.ai{background:#2a2147;color:var(--accent2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:5px 12px;font:600 12px var(--sans);cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
input[type=search],input[type=number]{background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font:13px var(--sans)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.alert{border-left:3px solid var(--warn);padding:7px 10px;background:#1c1a12;border-radius:6px;margin-bottom:6px;font-size:13px}
.alert.ok{border-color:var(--up);background:#0f1d18}
.alert.bad{border-color:var(--down);background:#1f1214}
svg text{fill:var(--muted);font:11px var(--mono)}
.tip{position:absolute;pointer-events:none;background:#0d131a;border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font:12px var(--mono);white-space:nowrap;z-index:5;display:none}
.chart{position:relative}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.heat td{text-align:center;font:11px var(--mono);padding:5px 4px;color:#e6edf3}
.heat th{text-align:center;font-size:10px;padding:5px 4px;cursor:default}
.idea{cursor:pointer} .idea:hover{border-color:var(--accent)}
.idea h3{margin:0 0 4px;font:700 16px var(--mono);display:flex;gap:8px;align-items:center}
.idea p{margin:6px 0 0;font-size:13px}
.heads{margin:8px 0 0;padding-left:16px;color:var(--muted);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;z-index:50;overflow-y:auto;padding:30px 14px}
#modal.on{display:block}
.mbox{max-width:1050px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.mhead{position:relative;padding-right:46px}
.mgrid{grid-template-columns:1.2fr 1fr} @media (max-width:900px){.mgrid{grid-template-columns:1fr}}
.mhead h2{margin:0;font:700 22px var(--mono);color:var(--text);letter-spacing:0;text-transform:none}
.x{position:absolute;top:0;right:0;background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;
  width:34px;height:34px;font-size:18px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.stats b{display:block;font:600 14px var(--mono)} .stats small{color:var(--muted);font-size:11px}
.calc label{font-size:12px;color:var(--muted);display:block;margin-top:8px}
.calc .val{float:right;color:var(--text);font-family:var(--mono)}
.glossary dt{font-weight:700;margin-top:8px} .glossary dd{margin:2px 0 0;color:var(--muted);font-size:13px}
footer{color:var(--dim);font-size:12px;padding:20px;text-align:center;border-top:1px solid var(--line)}
@media (max-width:600px){header{padding:12px 16px} main{padding:14px 16px 50px} .kpi .v{font-size:17px}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:var(--chip);color:var(--muted);border:0;padding:4px 10px;font:700 12px var(--sans);cursor:pointer}
.lang button.on{background:var(--accent);color:#06121f}
.help{color:var(--muted);font-size:13px;margin:-4px 0 10px;max-width:980px}
.card .help,.stats+.help{margin:8px 0 0} .grid+.help{margin:10px 0 0}
.brief{border-color:#2b4a6b;background:linear-gradient(180deg,#14202d,#131a22)}
.brief p{margin:0;font-size:15px;line-height:1.6}
h3.sub{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
table.mth td,table.mth th{padding:5px 7px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>hedg<span>_</span>fund · <span id="h-title" style="color:inherit"></span></h1>
  <span class="pill" id="p-time"></span>
  <span class="pill" id="p-vix"></span>
  <span class="pill" id="p-cycle"></span>
  <span class="spacer"></span>
  <span class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></span>
  <a class="pill" id="p-classic" href="classic.html"></a>
</header>
<nav id="tabs"></nav>
<main>
  <section id="t-overview"></section>
  <section id="t-positions"></section>
  <section id="t-risk"></section>
  <section id="t-greeks"></section>
  <section id="t-markets"></section>
  <section id="t-ideas"></section>
  <section id="t-weeks"></section>
  <section id="t-activity"></section>
  <section id="t-fact"></section>
  <section id="t-context"></section>
</main>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<footer id="foot"></footer>
<script>
const D = /*__DATA__*/null;
// ───────── langue (FR / EN) ─────────
let LANG = (()=>{ const q=new URLSearchParams(location.search).get("lang"); if(q==="en"||q==="fr") return q;
  try{ return localStorage.getItem("lang")||"fr"; }catch(e){ return "fr"; } })();
const T = (fr, en) => LANG==="en" ? en : fr;
// traductions des textes qui viennent des données (calculées en Python, en français)
const EN = {
  "Technologie":"Technology","Communication":"Communication","Consommation discrétionnaire":"Consumer discretionary",
  "Consommation de base":"Consumer staples","Finance":"Financials","Santé":"Health care","Énergie":"Energy",
  "Industrie":"Industrials","Matériaux":"Materials","Services publics":"Utilities","Immobilier":"Real estate",
  "Autre":"Other","Crypto":"Crypto","Indice S&P 500":"S&P 500 index","Nasdaq 100":"Nasdaq 100",
  "Petites capitalisations":"Small caps","Dow Jones":"Dow Jones","Or":"Gold","Pétrole":"Oil",
  "Trésor US 20+ ans":"US Treasuries 20+ yr","Trésor US 7-10 ans":"US Treasuries 7-10 yr","Trésor US 1-3 ans":"US Treasuries 1-3 yr",
  "Trésor indexé inflation":"Inflation-linked Treasuries","Entreprises IG":"Investment-grade corporates","Haut rendement":"High yield",
  "Actions":"Stocks","ETF actions":"Equity ETFs","Obligations":"Bonds","Or / matières":"Gold / commodities","Cash":"Cash",
  "Socle S&P 500":"S&P 500 core","Bons du Trésor":"Treasury bills",
  "haussière":"uptrend","baissière":"downtrend","neutre":"neutral","haussiere":"uptrend","baissiere":"downtrend",
  "Univers du fonds":"Fund universe","Actions screenées":"Screened stocks","Idées presse":"Press ideas",
  "Cryptos":"Crypto","Univers poche IA":"AI sleeve universe","En portefeuille":"Held","Poche IA (position)":"AI sleeve (position)",
  "implicite (Alpaca)":"implied (Alpaca)","réalisée 20 j":"realized 20 d",
  "Actions −10 %":"Stocks −10%","Krach actions −20 %":"Equity crash −20%","Taux +1 % (TLT ≈ −16 %)":"Rates +1% (TLT ≈ −16%)",
  "Bitcoin −30 %":"Bitcoin −30%","Or −10 %":"Gold −10%","Volatilité +10 pts (poche options)":"Volatility +10 pts (options sleeve)",
  "Positions ouvertes (fonds)":"Open positions (fund)","Exposition des stratégies":"Strategy exposure",
  "Risque engagé jusqu'aux stops":"Risk to stops","Trades IA ouverts":"Open AI trades","|Δ $| poche IA / capital":"|Δ $| AI sleeve / capital",
  "|Vega| poche IA (par pt de vol)":"|Vega| AI sleeve (per vol pt)","Θ poche IA par jour":"AI sleeve Θ per day",
  "Rendement annualisé":"Annualized return","Volatilité annualisée":"Annualized volatility","Ratio de Sharpe":"Sharpe ratio",
  "Ratio de Sortino":"Sortino ratio","Perte maximale (max drawdown)":"Max drawdown","Ratio de Calmar":"Calmar ratio",
  "VaR 95 % (1 jour)":"VaR 95% (1 day)","CVaR 95 % (1 jour)":"CVaR 95% (1 day)","Meilleur / pire mois":"Best / worst month",
  "Mois positifs":"Positive months","Bêta vs S&P 500":"Beta vs S&P 500","Alpha annuel (Jensen)":"Annual alpha (Jensen)",
  "Corrélation vs S&P 500":"Correlation vs S&P 500",
  "VIX (peur)":"VIX (fear)","Taux US 10 ans":"US 10-yr yield","Dollar (DXY)":"Dollar (DXY)","Pétrole WTI":"WTI oil","Or (once)":"Gold (oz)","Bitcoin":"Bitcoin",
  "Suivi de tendance":"Trend following","Retour à la moyenne":"Mean reversion","Cassure":"Breakout",
  "ACHAT":"BUY","SORTIE":"EXIT","achat récent":"recent buy",
  "signal":"signal","stop":"stop","target":"target","fin_historique":"end of data",
  "Take-profit":"Take-profit","Stop-loss":"Stop-loss","Echeance proche":"Close to expiry",
};
const tr = s => (LANG==="en" && s!=null && EN[s]) ? EN[s] : (s ?? "");
const LOC = () => LANG==="en" ? "en-US" : "fr-FR";
// ───────── formatage ─────────
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = x => typeof x === "number" && isFinite(x);
const nf = (x, d=2) => isNum(x) ? x.toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d}) : "—";
const money = (x, d=0) => !isNum(x) ? "—" : LANG==="en" ? (x<0?"−$":"$")+nf(Math.abs(x),d) : nf(x,d)+" $";
const pct = (x, d=2, sign=true) => isNum(x) ? (sign && x>0 ? "+" : "")+nf(x,d)+(LANG==="en"?"%":" %") : "—";
const cls = x => isNum(x) ? (x>0 ? "up" : x<0 ? "down" : "") : "";
const sp = (x, d=2) => `<span class="${cls(x)}">${pct(x,d)}</span>`;
const px = x => isNum(x) ? nf(x, Math.abs(x) < 1 ? 4 : 2) : "—";
const dd_ = s => esc(String(s||"—").replace("T"," ").slice(0,16));
const day = n => LANG==="en" ? `${n} d` : `${n} j`;
const mm = x => !isNum(x) ? "—" : LANG==="en" ? `$${nf(x,0)}M` : `${nf(x,0)} M$`;
const COLORS = ["#5eb1ff","#a78bfa","#34d399","#fbbf24","#f472b6","#22d3ee","#fb923c","#94a3b8","#4ade80","#e879f9"];
const help = (fr, en) => `<p class="help">${T(fr,en)}</p>`;

// ───────── Black-Scholes (mêmes formules que quantlab/pricing.py) ─────────
function ncdf(x){ const t=1/(1+0.2316419*Math.abs(x)); const d=0.3989422804014327*Math.exp(-x*x/2);
  const p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return x>0 ? 1-p : p; }
const npdf = x => Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function bs(S,K,T_,r,v,kind){
  if(T_<=0||v<=0){ const f=S-K*Math.exp(-r*Math.max(T_,0)); return {price:Math.max(kind==="call"?f:-f,0),delta:0,gamma:0,vega:0,theta:0,rho:0,itm:0}; }
  const sq=Math.sqrt(T_), d1=(Math.log(S/K)+(r+v*v/2)*T_)/(v*sq), d2=d1-v*sq, disc=Math.exp(-r*T_);
  const gamma=npdf(d1)/(S*v*sq), vega=S*npdf(d1)*sq, common=-S*v*npdf(d1)/(2*sq);
  if(kind==="call") return {price:S*ncdf(d1)-K*disc*ncdf(d2), delta:ncdf(d1), gamma, vega:vega/100,
     theta:(common-r*K*disc*ncdf(d2))/365, rho:K*T_*disc*ncdf(d2)/100, itm:ncdf(d2)};
  return {price:K*disc*ncdf(-d2)-S*ncdf(-d1), delta:ncdf(d1)-1, gamma, vega:vega/100,
     theta:(common+r*K*disc*ncdf(-d2))/365, rho:-K*T_*disc*ncdf(-d2)/100, itm:ncdf(-d2)};
}

// ───────── graphiques SVG (sans dépendance) ─────────
function lineChart(el, {x, series, hlines=[], h=260, fmt=v=>nf(v,2)}){
  el.classList.add("chart"); el.innerHTML="";
  const W = Math.max(el.clientWidth||700, 280), H=h, L=58, R=10, Tp=10, B=24;
  const sv = series.flatMap(s=>s.data.filter(isNum)), smin=Math.min(...sv), smax=Math.max(...sv);
  hlines = hlines.filter(l=>isNum(l.y) && l.y>smin*0.75 && l.y<smax*1.33);
  const all = sv.concat(hlines.map(l=>l.y));
  if(!all.length||!x.length){ el.innerHTML=`<p class="note">${T("Pas encore de données.","No data yet.")}</p>`; return; }
  let lo=Math.min(...all), hi=Math.max(...all); if(lo===hi){lo-=1;hi+=1} const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
  const n=x.length, X=i=>L+(W-L-R)*(n<2?0:i/(n-1)), Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f2a36"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  const ticks=Math.min(W<520?3:6,n); for(let k=0;k<ticks;k++){ const i=Math.round((n-1)*k/Math.max(ticks-1,1)); g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${k===0?"start":k===ticks-1?"end":"middle"}">${esc(String(x[i]).slice(2,10))}</text>`; }
  for(const l of hlines){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.color}" stroke-dasharray="4 4"/><text x="${W-R-4}" y="${Y(l.y)-4}" text-anchor="end" style="fill:${l.color}">${esc(l.label)}</text>`; }
  for(const s of series){ let d="", pen=false; s.data.forEach((v,i)=>{ if(isNum(v)){ d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1); pen=true;} else pen=false; });
    if(s.fill && s.data.length){ const f=s.data.findIndex(isNum); g+=`<path d="${d}L${X(n-1)},${H-B}L${X(f)},${H-B}Z" fill="${s.color}" opacity=".08"/>`; }
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.8}" ${s.dash?'stroke-dasharray="5 4"':""}/>`; }
  el.innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;height:${H}px">${g}<line id="cx" y1="${Tp}" y2="${H-B}" stroke="#3b4a5c" style="display:none"/></svg><div class="tip"></div>`
    + (series.length>1 ? `<div class="legend">${series.map(s=>`<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>`:"");
  const svg=el.querySelector("svg"), tip=el.querySelector(".tip"), cx=el.querySelector("#cx");
  svg.addEventListener("mousemove", e=>{ const r=svg.getBoundingClientRect(); const xx=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.round((xx-L)/(W-L-R)*(n-1)))); cx.setAttribute("x1",X(i)); cx.setAttribute("x2",X(i)); cx.style.display="";
    tip.innerHTML=`${esc(x[i])}<br>`+series.map(s=>`<span style="color:${s.color}">${esc(s.name)}</span> ${fmt(s.data[i])}`).join("<br>");
    tip.style.display="block"; const left=(X(i)/W)*r.width; tip.style.left=Math.min(left+12, r.width-tip.offsetWidth-4)+"px"; tip.style.top="8px"; });
  svg.addEventListener("mouseleave", ()=>{tip.style.display="none"; cx.style.display="none"});
}
function spark(data, color){ const v=(data||[]).filter(isNum); if(v.length<2) return ""; const lo=Math.min(...v), hi=Math.max(...v)||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*100).toFixed(1)},${(28-(y-lo)/((hi-lo)||1)*26).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:30px;display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`; }

function barChart(el, {x, series, h=240, fmt=v=>pct(v,1)}){
  el.classList.add("chart"); const W=Math.max(el.clientWidth||700,280), H=h, L=46, R=8, Tp=10, B=26;
  const all=series.flatMap(s=>s.data.filter(isNum)); if(!all.length){ el.innerHTML=`<p class="note">${T("Pas encore de données.","No data yet.")}</p>`; return; }
  let lo=Math.min(0,...all), hi=Math.max(0,...all); const pad=(hi-lo)*.08||1; lo-=pad; hi+=pad;
  const n=x.length, gw=(W-L-R)/n, bw=Math.max(2,gw*0.8/series.length), Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  let g=""; for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f2a36"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#3b4a5c"/>`;

      g+=`<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${Math.max(1,y1-y0).toFixed(1)}" fill="${typeof s.color==="function"?s.color(v):s.color}" rx="1.5"><title>${esc(lab)} · ${esc(s.name)} ${fmt(v)}</title></rect>`; });

    + `<div class="legend">${series.map(s=>`<span style="--c:${s.legend||s.color}">${esc(s.name)}</span>`).join("")}</div>`;

function table(el, cols, rows, onClick){
  let key=null, dir=-1;
  const draw=()=>{ const rs=[...rows]; if(key!==null){ const c=cols[key]; const v=r=>c.sort?c.sort(r):r[c.k];
      rs.sort((a,b)=>{ const x=v(a), y=v(b); if(x==null) return 1; if(y==null) return -1; return (x>y?1:x<y?-1:0)*dir; }); }
    el.innerHTML=`<div class="tbl"><table><thead><tr>${cols.map((c,i)=>`<th class="${c.n?"n":""}" data-i="${i}">${c.t}${key===i?(dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${
      rs.length? rs.map(r=>`<tr class="${onClick?"click":""}" data-j="${rows.indexOf(r)}">${cols.map(c=>`<td class="${c.n?"n":""}">${c.f?c.f(r):esc(r[c.k])}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${cols.length}" class="muted">${T("Rien pour l'instant.","Nothing yet.")}</td></tr>`}</tbody></table></div>`;
    el.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const i=+th.dataset.i; if(key===i) dir=-dir; else {key=i; dir=-1;} draw(); });
    if(onClick) el.querySelectorAll("tbody tr.click").forEach(trr=>trr.onclick=()=>onClick(rows[+trr.dataset.j])); };
  draw();
}

  el.innerHTML=`<h2>${T("Activité réelle du compte papier","Actual paper-account activity")}</h2><div class="grid kpis">
   ${kpi(T("Trades clôturés","Closed trades"),a.trades??"—",`${nf(a.per_month,1)} ${T("par mois","per month")}`)}${kpi(T("Taux de réussite","Win rate"),isNum(a.win_rate)?pct(a.win_rate,0,false):"—")}
   ${kpi(T("Gain moyen","Average win"),money(a.avg_win),"","up")}${kpi(T("Perte moyenne","Average loss"),money(a.avg_loss),"","down")}
   ${kpi("Profit factor",nf(a.profit_factor),T("gains ÷ pertes","wins ÷ losses"))}${kpi(T("Réalisé (fonds)","Realized (fund)"),money(a.realized),"",cls(a.realized))}
   ${kpi(T("Réalisé (poche IA)","Realized (AI sleeve)"),money(a.ai_realized),isNum(a.ai_win_rate)?`${T("réussite","win rate")} ${pct(a.ai_win_rate*100,0,false)}`:"",cls(a.ai_realized))}</div>
  <h2>${T("Trades du fonds","Fund trades")}</h2><div id="ac-f"></div><h2>${T("Trades clôturés de la poche IA","Closed AI sleeve trades")}</h2><div id="ac-a"></div>`;
  table($("#ac-f",el),[{t:T("Actif","Asset"),k:"symbol",f:r=>`<span class="sym">${esc(r.symbol)}</span>`},{t:T("Stratégie","Strategy"),k:"strategy"},{t:T("Entrée","Entry"),k:"entry_date"},{t:T("Sortie","Exit"),k:"exit_date"},
    {t:T("Prix d'entrée","Entry price"),k:"entry",n:1,f:r=>px(r.entry)},{t:T("Prix de sortie","Exit price"),k:"exit",n:1,f:r=>px(r.exit)},{t:"P&L",k:"pnl",n:1,f:r=>`<span class="${cls(r.pnl)}">${money(r.pnl)}</span>`},
    {t:"%",k:"pnl_pct",n:1,f:r=>sp(r.pnl_pct)},{t:T("Raison","Reason"),k:"reason",f:r=>esc(tr(r.reason))}], a.history||[], r=>openAsset(r.symbol));
  table($("#ac-a",el),[{t:T("Actif","Asset"),k:"underlying"},{t:T("Stratégie","Strategy"),k:"strategy",f:r=>esc(kind(r))},{t:T("Ouvert","Opened"),k:"opened_at",f:r=>esc(String(r.opened_at||"").slice(0,10))},
    {t:T("Fermé","Closed"),k:"closed_at",f:r=>esc(String(r.closed_at||"").slice(0,10))},{t:"P&L",k:"pnl",n:1,f:r=>`<span class="${cls(r.pnl)}">${money(r.pnl)}</span>`},{t:T("Raison","Reason"),k:"close_reason",f:r=>esc(tr(r.close_reason))}], a.ai_closed||[]);
},
fact(el){
  const f=D.factsheet||{}, b=D.backtest;
  const MONTHS = LANG==="en" ? ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Year"] : ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc","Année"];
  const m=(b&&b.monthly)||{years:[],values:[]};
  const mt=`<div class="tbl"><table class="mth"><tr><th></th>${MONTHS.map(x=>`<th class="n">${x}</th>`).join("")}</tr>${m.years.map((y,i)=>`<tr><th>${y}</th>${m.values[i].map(v=>`<td class="n ${cls(v)}">${isNum(v)?nf(v,1):""}</td>`).join("")}</tr>`).join("")}</table></div>`;
  el.innerHTML=`<h2>${T("La stratégie rejouée sur l'historique (base 100)","The strategy replayed on history (base 100)")}</h2>
   ${help(`Simulation sur données réelles avec les règles actuelles du fonds. « Net » = après ${pct((f.mgmt||0)*100,2,false)} de frais de gestion et ${pct((f.perf||0)*100,2,false)} des gains (moyenne des hedge funds, HFR fin 2025) : c'est ce que toucherait un client. Une simulation n'est pas une promesse.`,
          `Simulation on real data with the fund's current rules. "Net" = after a ${pct((f.mgmt||0)*100,2,false)} management fee and ${pct((f.perf||0)*100,2,false)} of gains (hedge fund average, HFR end-2025): what a client would get. A simulation is not a promise.`)}
   <div class="card"><div id="fs-c"></div></div>
   <div class="grid half" style="margin-top:12px"><div class="card"><h2 style="margin-top:0">${T("Indicateurs","Key figures")}</h2><div id="fs-t"></div></div>
   <div class="card" style="overflow-x:auto"><h2 style="margin-top:0">${T("Rendements mensuels nets (%)","Net monthly returns (%)")}</h2>${mt}</div></div>`;
  if(b) lineChart($("#fs-c",el),{x:b.d,series:[{name:T("Avant frais","Before fees"),data:b.gross,color:"#5eb1ff",w:2},{name:T("Après frais","After fees"),data:b.net,color:"#34d399",w:2},...(b.spy?[{name:"S&P 500",data:b.spy,color:"#8b98a7",dash:true}]:[])],h:300,fmt:v=>nf(v,0)});
  const g=f.gross_rows||[], n=f.net_rows||[];
  $("#fs-t",el).innerHTML=`<div class="tbl"><table><tr><th>${T("Indicateur","Metric")}</th><th class="n">${T("Avant frais","Before fees")}</th><th class="n">${T("Après frais","After fees")}</th></tr>${g.map((r,i)=>`<tr><td>${esc(tr(r[0]))}</td><td class="n">${esc(r[1])}</td><td class="n">${esc((n[i]||[])[1])}</td></tr>`).join("")}</table></div>`;
},
context(el){
  const g=D.gauge||{};
  const LEVEL={"risk-off":T("PEUR EXTRÊME","EXTREME FEAR"),"prudence":T("TENSION","ELEVATED"),"neutre":T("NORMAL","NORMAL"),"risk-on":T("CALME","CALM")};
  el.innerHTML=`<h2>${T("Climat de marché","Market climate")}</h2>${help("Le VIX mesure la peur sur les marchés. Il est affiché pour information : testé sur 20 ans, s'en servir pour bloquer les achats faisait perdre de l'argent.","The VIX measures market fear. It is shown for information: tested over 20 years, using it to block purchases lost money.")}<div class="grid kpis">
   ${kpi(T("Niveau de peur","Fear level"), esc(LEVEL[g.level]||"—"), "", g.level==="risk-off"?"down":g.level==="prudence"?"warn":"")}
   ${kpi("VIX", nf(g.vix,1), isNum(g.vix_pct)?T(`plus haut que ${Math.round(g.vix_pct*100)} % des 2 dernières années`,`higher than ${Math.round(g.vix_pct*100)}% of the last 2 years`):"")}
   ${kpi(T("Or sur 1 mois","Gold, 1 month"), pct(isNum(g.gold_1m)?g.gold_1m*100:null,1), "", cls(g.gold_1m))}
   ${kpi(T("Pétrole sur 1 mois","Oil, 1 month"), pct(isNum(g.oil_1m)?g.oil_1m*100:null,1), "", cls(g.oil_1m))}</div>
  <h2>Macro</h2><div class="grid kpis">${(D.macro||[]).map(m=>`<div class="card kpi"><div class="l">${esc(tr(m.label))}</div><div class="v">${px(m.last)}</div>
   <div class="s">${sp(m.chg_1d)} ${T("jour","day")} · ${sp(m.chg_1m,1)} ${T("mois","month")}</div>${spark(m.spark, (m.chg_1m||0)>=0?"#34d399":"#f87171")}</div>`).join("")}</div>
  <h2>${T("Derniers titres de la presse financière","Latest financial headlines")}</h2><div class="card">${(D.headlines||[]).map(h=>`<div class="row"><span>${esc(h)}</span></div>`).join("")||`<p class="note">${T("Indisponible dans ce run.","Unavailable in this run.")}</p>`}</div>`;
},
};

// ───────── fiche d'un actif ─────────
function openAsset(sym){
  const a=ASSETS[sym], p=POS[sym], box=$("#mbox");
  if(!a){ box.innerHTML=`<div class="mhead"><h2>${esc(sym)}</h2><button class="x" onclick="closeM()">×</button></div><p class="note">${T("Pas de données de marché pour cet actif dans ce run.","No market data for this asset in this run.")}</p>`; $("#modal").classList.add("on"); return; }
  const v0=vol(a), crypto=a.asset_class==="Crypto", stt=(k,v,c="")=>`<div><small>${k}</small><b class="${c}">${v}</b></div>`;
  box.innerHTML=`<div class="mhead"><div><h2>${esc(a.symbol)} <span class="num" style="font-size:18px">${px(a.price)}</span> ${sp(a.chg_1d)}</h2>
     <div class="muted" style="margin-top:4px">${esc(tr(a.name||a.sector))} · ${esc(tr(a.asset_class))} ${a.groups.map(g=>`<span class="tag">${esc(tr(g))}</span>`).join("")}</div></div><button class="x" onclick="closeM()" aria-label="${T("Fermer","Close")}">×</button></div>
   <div class="card" style="margin-top:12px"><div id="m-chart"></div></div>
   <div class="grid mgrid" style="margin-top:12px">
    <div>
     <div class="stats">
      ${stt(T("5 jours","5 days"),pct(a.chg_5d,1),cls(a.chg_5d))}${stt(T("1 mois","1 month"),pct(a.chg_1m,1),cls(a.chg_1m))}${stt(T("3 mois","3 months"),pct(a.chg_3m,1),cls(a.chg_3m))}${stt(T("1 an","1 year"),pct(a.chg_1y,1),cls(a.chg_1y))}
      ${stt("RSI 14",nf(a.rsi,0))}${stt(T("Tendance","Trend"),esc(tr(a.trend)),a.trend==="haussière"?"up":a.trend==="baissière"?"down":"")}
      ${stt(T("Vol réalisée 20 j","Realized vol 20 d"),pct(a.hv*100,1,false))}${stt(T("Vol réalisée 60 j","Realized vol 60 d"),pct((a.hv60||0)*100,1,false))}
      ${stt(T("Vol implicite","Implied vol"),a.iv?pct(a.iv*100,1,false):"—")}${stt("IV / HV",a.iv?nf(a.iv/a.hv,2):"—",a.iv&&a.iv/a.hv>1.3?"warn":"")}
      ${stt(T("ATR (jour)","ATR (day)"),pct(a.atr_pct,2,false))}${stt(T("Vs plus haut 1 an","Vs 1-yr high"),pct(a.from_high,1),cls(a.from_high))}
      ${stt(T("Volume / jour","Volume / day"),mm(a.adv_musd))}${stt(T("Résultats","Earnings"),isNum(a.earnings)?T("dans ","in ")+day(a.earnings):"—",isNum(a.earnings)&&a.earnings<=7?"warn":"")}
     </div>
     ${p?`<h2>${T("Position du fonds","Fund position")}</h2><div class="stats">${stt(T("Valeur","Value"),money(p.value))}${stt("P&L",`${money(p.pnl)} (${pct(p.pnl_pct,1)})`,cls(p.pnl))}${stt("Stop",`${px(p.stop)} (${pct(p.to_stop_pct,1)})`)}${stt(T("Stratégie","Strategy"),esc(p.strategy))}</div>`:""}
     ${aiBlock(AIPOS[a.symbol])}
     <h2>${T("Ce que disent les stratégies du fonds principal","What the core fund's strategies say")}</h2>
     <div class="card">${(a.signals||[]).map(s=>`<div class="row"><span>${esc(tr(s.name))}</span><span class="tag ${s.state==="ACHAT"?"buy":s.state==="SORTIE"?"sell":""}">${esc(tr(s.state))}</span></div>`).join("")||`<p class="note">${T("Historique trop court pour les signaux.","History too short for signals.")}</p>`}
      ${help("ACHAT = signal d'entrée aujourd'hui ; SORTIE = le fonds sortirait s'il détenait l'actif. Le fonds n'achète que dans son univers testé.","BUY = entry signal today; EXIT = the fund would exit if it held the asset. The fund only buys within its tested universe.")}</div>
     ${a.idea?`<h2>${T("Idée presse","Press idea")}</h2><div class="card"><div class="muted" style="font-size:12px">Score ${nf(a.idea.score,1)} · ${a.idea.mentions} articles · ${T("ton","tone")} ${nf(a.idea.sentiment,2)} ${a.idea.niche?'<span class="tag niche">niche</span>':""}</div>${a.idea.why?`<p>${esc(LANG==="en"&&a.idea.why_en?a.idea.why_en:a.idea.why)}</p><p class="warn" style="font-size:12px">⚠ ${esc(LANG==="en"&&a.idea.risk_en?a.idea.risk_en:(a.idea.risk||""))}</p>`:""}</div>`:""}
     <h2>${T("Actualité","News")}</h2><div class="card">${(a.news||[]).map(h=>`<div class="row"><span>${esc(h)}</span></div>`).join("")||`<p class="note">${T("Pas de titre récent.","No recent headline.")}</p>`}</div>
    </div>
    <div class="card calc"><h2 style="margin-top:0">${T("Calculateur d'options (Black-Scholes)","Option calculator (Black-Scholes)")}</h2>
     ${help("Pour comprendre les prix et les grecques : rien n'est acheté ici.","To understand prices and Greeks: nothing is bought here.")}
     ${crypto?`<p class="note">${T("Pas d'options crypto sur Alpaca : calcul théorique.","No crypto options on Alpaca: theoretical calculation.")}</p>`:""}
     <label>Strike <span class="val" id="c-kv"></span></label><input type="range" id="c-k" min="70" max="130" step="1" value="100">
     <label>${T("Jours avant échéance","Days to expiry")} <span class="val" id="c-tv"></span></label><input type="range" id="c-t" min="1" max="365" step="1" value="30">
     <label>${T("Volatilité","Volatility")} <span class="val" id="c-vv"></span></label><input type="range" id="c-v" min="5" max="200" step="0.5" value="${(v0*100).toFixed(1)}">
     <p class="note" style="margin-top:4px">${T("Vol de départ","Starting vol")} : ${esc(tr(a.vol_source))} (${pct(v0*100,1,false)}). ${T("Taux sans risque","Risk-free rate")} ${pct(D.risk_free*100,1,false)}.</p>
     <div id="c-out"></div></div>
   </div>`;
  const ch=a.chart, hl=[]; if(p){ hl.push({y:p.entry,label:T("entrée","entry"),color:"#5eb1ff"}); if(p.stop) hl.push({y:p.stop,label:"stop",color:"#f87171"}); }
  (AIPOS[a.symbol]||[]).forEach(r=>{ if(isNum(r.stop_price)) hl.push({y:r.stop_price,label:T("stop IA","AI stop"),color:"#f87171"}); if(isNum(r.target_price)) hl.push({y:r.target_price,label:T("objectif IA","AI target"),color:"#34d399"});
    (r.legs||[]).forEach(l=>hl.push({y:l.strike,label:`${l.side==="buy"?"+":"−"}${l.type} ${px(l.strike)}`,color:"#a78bfa"})); });
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
  lineChart($("#m-chart"),{x:ch.d,series:[{name:T("Cours","Price"),data:ch.c,color:"#e6edf3",w:2,fill:true},{name:T("Moyenne 20 j","20-day average"),data:ch.e20,color:"#5eb1ff"},{name:T("Moyenne 50 j","50-day average"),data:ch.e50,color:"#fbbf24"}],hlines:hl,h:280,fmt:px});
  const calc=()=>{ const S=a.price, K=S*(+$("#c-k").value)/100, days=+$("#c-t").value, v=+$("#c-v").value/100, T_=days/365, r=D.risk_free;
    $("#c-kv").textContent=`${px(K)} (${$("#c-k").value}%)`; $("#c-tv").textContent=day(days); $("#c-vv").textContent=pct(v*100,1,false);
    const c=bs(S,K,T_,r,v,"call"), q=bs(S,K,T_,r,v,"put"), str=c.price+q.price;
    const line=(l,x,y,d=2)=>`<tr><td>${l}</td><td class="n">${nf(x,d)}</td><td class="n">${nf(y,d)}</td></tr>`;
    $("#c-out").innerHTML=`<div class="tbl" style="margin-top:10px"><table><tr><th></th><th class="n">Call</th><th class="n">Put</th></tr>
      ${line(T("Prix (par action)","Price (per share)"),c.price,q.price)}${line(T("Prix d'un contrat (×100)","Price per contract (×100)"),c.price*100,q.price*100,0)}
      ${line("Delta",c.delta,q.delta,3)}${line("Gamma",c.gamma,q.gamma,4)}${line(T("Vega (par pt de vol)","Vega (per vol pt)"),c.vega,q.vega,3)}
      ${line(T("Theta (par jour)","Theta (per day)"),c.theta,q.theta,3)}${line(T("Rho (par pt de taux)","Rho (per rate pt)"),c.rho,q.rho,3)}${line(T("Proba. de finir gagnant au strike (%)","Probability to finish in the money (%)"),c.itm*100,q.itm*100,0)}</table></div>
      <div class="stats" style="margin-top:10px">${stt("Straddle (call + put)",px(str))}${stt(T("Points morts","Breakevens"),`${px(K-str)} / ${px(K+str)}`)}${stt(T("Mouvement attendu","Expected move"),"± "+pct(str/S*100,1,false))}
       <div><small>${T("Parité C − P","Put-call parity C − P")}</small><b>${nf(c.price-q.price,2)}</b><small>= S − K·e^(−rT) = ${nf(S-K*Math.exp(-r*T_),2)}</small></div></div>`; };
  const opt=(AIPOS[a.symbol]||[]).find(r=>r.legs&&r.legs.length);
  if(opt){ const k=Math.round(opt.legs[0].strike/a.price*100); $("#c-k").value=Math.max(70,Math.min(130,k));
    if(opt.expiry){ const d=Math.round((new Date(opt.expiry)-new Date())/864e5); $("#c-t").value=Math.max(1,Math.min(365,d)); }
    $("#c-kv").parentElement.insertAdjacentHTML("beforebegin",`<p class="note warn" style="margin:0">${T("Réglé sur la 1re jambe du trade réel","Set to the real trade's first leg")} (${opt.legs[0].type} ${px(opt.legs[0].strike)}, ${esc(opt.expiry||"")}).</p>`); }
  ["#c-k","#c-t","#c-v"].forEach(s=>$(s).oninput=calc); calc();
}
function closeM(){ $("#modal").classList.remove("on"); document.body.style.overflow=""; }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeM(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeM(); });

// ───────── démarrage / changement de langue ─────────
function frame(){
  document.documentElement.lang=LANG; document.title=T("Terminal du gérant","Fund manager terminal");
  $("#h-title").textContent=T("terminal du gérant","fund manager terminal");
  $("#p-time").innerHTML=`${T("Mis à jour","Updated")} <b>${esc(D.generated_at)}</b>`;
  const LV={"risk-off":T("peur extrême","extreme fear"),"prudence":T("tension","elevated"),"neutre":T("normal","normal"),"risk-on":T("calme","calm")};
  $("#p-vix").innerHTML=`VIX ${nf(D.gauge.vix,1)} · <b class="${D.gauge.level==="risk-off"?"down":D.gauge.level==="prudence"?"warn":"up"}">${esc(LV[D.gauge.level]||"—")}</b>`;
  $("#p-cycle").innerHTML=`${T("Dernier cycle du fonds","Last fund cycle")} <b>${dd_(D.overview.last_cycle)}</b>`;
  $("#p-classic").textContent=T("ancienne page","classic page");
  $("#foot").innerHTML=T("Capital fictif (paper trading) — outil d'entraînement. Performance passée ou simulée ≠ performance future. Commercialiser un fonds en France exige un agrément AMF.",
    "Simulated capital (paper trading) — training tool. Past or simulated performance ≠ future performance. Not an offer or investment advice.");
  $("#tabs").innerHTML=TABS().map(([id,l])=>`<button data-t="${id}">${l}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
  document.querySelectorAll(".lang button").forEach(b=>{ b.classList.toggle("on",b.dataset.l===LANG); b.onclick=()=>setLang(b.dataset.l); });
}
function setLang(l){ LANG=l; try{ localStorage.setItem("lang",l) }catch(e){} drawn={}; closeM(); frame(); show(current); }
frame();
let start=(location.hash||"").slice(1); try{ if(!RENDER[start]) start=localStorage.getItem("tab"); }catch(e){}
show(RENDER[start]?start:"overview");
</script>
