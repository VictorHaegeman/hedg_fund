<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal du gérant</title>
<style>
:root{
  --bg:#0b0f14; --bg2:#10161d; --panel:#131a22; --panel2:#18212b; --line:#223040;
  --text:#e6edf3; --muted:#8b98a7; --dim:#5f6d7c; --accent:#5eb1ff; --accent2:#a78bfa;
  --up:#34d399; --down:#f87171; --warn:#fbbf24; --chip:#1c2632;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
a{color:var(--accent)}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;
  border-bottom:1px solid var(--line);background:var(--bg2)}
header h1{font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:0;font-weight:700}
header h1 span{color:var(--accent)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);
  border:1px solid var(--line);white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.spacer{flex:1}
nav{position:sticky;top:0;z-index:20;display:flex;gap:2px;overflow-x:auto;background:var(--bg2);
  border-bottom:1px solid var(--line);padding:0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--muted);padding:12px 14px;font:600 13px var(--sans);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
section{display:none} section.on{display:block}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
h2:first-child{margin-top:4px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.two{grid-template-columns:2fr 1fr} .half{grid-template-columns:1fr 1fr}
@media (max-width:900px){.two,.half{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:600 20px var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;
  letter-spacing:.02em;text-align:left;padding:8px 10px;cursor:pointer;white-space:nowrap;user-select:none}
th.n,td.n{text-align:right}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#1a2430}
.sym{font-weight:700;font-family:var(--mono)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:4px}
.tag.buy{background:#0f3b2c;color:var(--up)} .tag.sell{background:#3d1a1d;color:var(--down)}
.tag.niche{background:#33280d;color:var(--warn)} .tag.ai{background:#2a2147;color:var(--accent2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:5px 12px;font:600 12px var(--sans);cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
input[type=search],input[type=number]{background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font:13px var(--sans)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.alert{border-left:3px solid var(--warn);padding:7px 10px;background:#1c1a12;border-radius:6px;margin-bottom:6px;font-size:13px}
.alert.ok{border-color:var(--up);background:#0f1d18}
.alert.bad{border-color:var(--down);background:#1f1214}
svg text{fill:var(--muted);font:11px var(--mono)}
.tip{position:absolute;pointer-events:none;background:#0d131a;border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font:12px var(--mono);white-space:nowrap;z-index:5;display:none}
.chart{position:relative}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.heat td{text-align:center;font:11px var(--mono);padding:5px 4px;color:#e6edf3}
.heat th{text-align:center;font-size:10px;padding:5px 4px;cursor:default}
.idea{cursor:pointer} .idea:hover{border-color:var(--accent)}
.idea h3{margin:0 0 4px;font:700 16px var(--mono);display:flex;gap:8px;align-items:center}
.idea p{margin:6px 0 0;font-size:13px}
.heads{margin:8px 0 0;padding-left:16px;color:var(--muted);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;z-index:50;overflow-y:auto;padding:30px 14px}
#modal.on{display:block}
.mbox{max-width:1050px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.mhead{position:relative;padding-right:46px}
.mgrid{grid-template-columns:1.2fr 1fr} @media (max-width:900px){.mgrid{grid-template-columns:1fr}}
.mhead h2{margin:0;font:700 22px var(--mono);color:var(--text);letter-spacing:0;text-transform:none}
.x{position:absolute;top:0;right:0;background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;
  width:34px;height:34px;font-size:18px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.stats b{display:block;font:600 14px var(--mono)} .stats small{color:var(--muted);font-size:11px}
.calc label{font-size:12px;color:var(--muted);display:block;margin-top:8px}
.calc .val{float:right;color:var(--text);font-family:var(--mono)}
.glossary dt{font-weight:700;margin-top:8px} .glossary dd{margin:2px 0 0;color:var(--muted);font-size:13px}
footer{color:var(--dim);font-size:12px;padding:20px;text-align:center;border-top:1px solid var(--line)}
@media (max-width:600px){header{padding:12px 16px} main{padding:14px 16px 50px} .kpi .v{font-size:17px}}
</style>
</head>

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = x => typeof x === "number" && isFinite(x);
const nf = (x, d=2) => isNum(x) ? x.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}) : "—";
const money = (x, d=0) => isNum(x) ? nf(x,d)+" $" : "—";
const pct = (x, d=2, sign=true) => isNum(x) ? (sign && x>0 ? "+" : "")+nf(x,d)+" %" : "—";

// ───────── Black-Scholes (mêmes formules que quantlab/pricing.py) ─────────
function ncdf(x){ const t=1/(1+0.2316419*Math.abs(x)); const d=0.3989422804014327*Math.exp(-x*x/2);
  const p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return x>0 ? 1-p : p; }
const npdf = x => Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function bs(S,K,T,r,v,kind){
  if(T<=0||v<=0){ const f=S-K*Math.exp(-r*Math.max(T,0)); return {price:Math.max(kind==="call"?f:-f,0),delta:0,gamma:0,vega:0,theta:0,rho:0,itm:0}; }
  const sq=Math.sqrt(T), d1=(Math.log(S/K)+(r+v*v/2)*T)/(v*sq), d2=d1-v*sq, disc=Math.exp(-r*T);
  const gamma=npdf(d1)/(S*v*sq), vega=S*npdf(d1)*sq, common=-S*v*npdf(d1)/(2*sq);
  if(kind==="call") return {price:S*ncdf(d1)-K*disc*ncdf(d2), delta:ncdf(d1), gamma, vega:vega/100,
     theta:(common-r*K*disc*ncdf(d2))/365, rho:K*T*disc*ncdf(d2)/100, itm:ncdf(d2)};
  return {price:K*disc*ncdf(-d2)-S*ncdf(-d1), delta:ncdf(d1)-1, gamma, vega:vega/100,
     theta:(common+r*K*disc*ncdf(-d2))/365, rho:-K*T*disc*ncdf(-d2)/100, itm:ncdf(-d2)};
}

// ───────── graphiques SVG (sans dépendance) ─────────
function lineChart(el, {x, series, hlines=[], h=260, fmt=v=>nf(v,2)}){
  el.classList.add("chart"); el.innerHTML="";
  const W = Math.max(el.clientWidth||700, 280), H=h, L=58, R=10, T=10, B=24;
  const sv = series.flatMap(s=>s.data.filter(isNum)), smin=Math.min(...sv), smax=Math.max(...sv);
  hlines = hlines.filter(l=>isNum(l.y) && l.y>smin*0.75 && l.y<smax*1.33);   // ligne hors échelle → masquée
  const all = sv.concat(hlines.map(l=>l.y));
  if(!all.length||!x.length){ el.innerHTML='<p class="note">Pas encore de données.</p>'; return; }
  let lo=Math.min(...all), hi=Math.max(...all); if(lo===hi){lo-=1;hi+=1} const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
  const n=x.length, X=i=>L+(W-L-R)*(n<2?0:i/(n-1)), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f2a36"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  const ticks=Math.min(W<520?3:6,n); for(let k=0;k<ticks;k++){ const i=Math.round((n-1)*k/Math.max(ticks-1,1)); g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${k===0?"start":k===ticks-1?"end":"middle"}">${esc(String(x[i]).slice(2,10))}</text>`; }
  for(const l of hlines){ if(!isNum(l.y)) continue; g+=`<line x1="${L}" x2="${W-R}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.color}" stroke-dasharray="4 4"/><text x="${W-R-4}" y="${Y(l.y)-4}" text-anchor="end" style="fill:${l.color}">${esc(l.label)}</text>`; }
  for(const s of series){ let d="", pen=false; s.data.forEach((v,i)=>{ if(isNum(v)){ d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1); pen=true;} else pen=false; });
    if(s.fill && s.data.length){ const f=s.data.findIndex(isNum); g+=`<path d="${d}L${X(n-1)},${H-B}L${X(f)},${H-B}Z" fill="${s.color}" opacity=".08"/>`; }
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.8}" ${s.dash?'stroke-dasharray="5 4"':""}/>`; }
  el.innerHTML=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;height:${H}px">${g}<line id="cx" y1="${T}" y2="${H-B}" stroke="#3b4a5c" style="display:none"/></svg><div class="tip"></div>`
    + (series.length>1 ? `<div class="legend">${series.map(s=>`<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>`:"");
  const svg=el.querySelector("svg"), tip=el.querySelector(".tip"), cx=el.querySelector("#cx");
  svg.addEventListener("mousemove", e=>{ const r=svg.getBoundingClientRect(); const xx=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.round((xx-L)/(W-L-R)*(n-1)))); cx.setAttribute("x1",X(i)); cx.setAttribute("x2",X(i)); cx.style.display="";
    tip.innerHTML=`${esc(x[i])}<br>`+series.map(s=>`<span style="color:${s.color}">${esc(s.name)}</span> ${fmt(s.data[i])}`).join("<br>");
    tip.style.display="block"; const left=(X(i)/W)*r.width; tip.style.left=Math.min(left+12, r.width-tip.offsetWidth-4)+"px"; tip.style.top="8px"; });
  svg.addEventListener("mouseleave", ()=>{tip.style.display="none"; cx.style.display="none"});
}

function table(el, cols, rows, onClick){
  let key=null, dir=-1;
  const draw=()=>{ const rs=[...rows]; if(key!==null){ const c=cols[key]; const v=r=>c.sort?c.sort(r):r[c.k];
      rs.sort((a,b)=>{ const x=v(a), y=v(b); if(x==null) return 1; if(y==null) return -1; return (x>y?1:x<y?-1:0)*dir; }); }
    el.innerHTML=`<div class="tbl"><table><thead><tr>${cols.map((c,i)=>`<th class="${c.n?"n":""}" data-i="${i}">${c.t}${key===i?(dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${
      rs.length? rs.map((r,j)=>`<tr class="${onClick?"click":""}" data-j="${rows.indexOf(r)}">${cols.map(c=>`<td class="${c.n?"n":""}">${c.f?c.f(r):esc(r[c.k])}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${cols.length}" class="muted">Rien pour l'instant.</td></tr>`}</tbody></table></div>`;
    el.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const i=+th.dataset.i; if(key===i) dir=-dir; else {key=i; dir=-1;} draw(); });
    if(onClick) el.querySelectorAll("tbody tr.click").forEach(tr=>tr.onclick=()=>onClick(rows[+tr.dataset.j])); };
  draw();
}

    {t:"Résultats",k:"earnings",n:1,f:r=>isNum(r.earnings)?`<span class="${r.earnings<=7?"warn":""}">${r.earnings} j</span>`:"—"},
    {t:"Signaux fonds",k:"signals",sort:r=>(r.signals||[]).filter(s=>s.state==="ACHAT").length,f:r=>(r.signals||[]).filter(s=>s.state!=="—").map(s=>`<span class="tag ${s.state==="ACHAT"?"buy":s.state==="SORTIE"?"sell":""}">${esc(s.key)} ${esc(s.state)}</span>`).join("")||'<span class="muted">—</span>'}];
  const draw=()=>table($("#mk-t",el),cols,(D.assets||[]).filter(a=>(grp==="Tous"||a.groups.includes(grp))&&(!q||(a.symbol+" "+a.sector+" "+a.name).toUpperCase().includes(q.toUpperCase()))),r=>openAsset(r.symbol));
  el.querySelectorAll("#mk-g button").forEach(b=>b.onclick=()=>{ grp=b.dataset.g; el.querySelectorAll("#mk-g button").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
  $("#mk-q",el).oninput=e=>{q=e.target.value; draw();}; draw();
},
ideas(el){
  const I=D.ideas||{}, list=I.ideas||[];
  el.innerHTML=`<h2>Sociétés qui font parler la presse financière (${esc(I.source||"Benzinga via Alpaca")}) — mis à jour ${esc((I.updated_at||"—").replace("T"," ").slice(0,16))}</h2>
  <p class="note">Filtrées : prix ≥ 5 $, au moins 10 M$ échangés par jour. « Niche » = moins de 50 M$/jour → la poche IA y met deux fois moins d'argent. Ce sont des pistes, pas des signaux testés.</p>
  <div class="grid kpis" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${list.map(i=>`<div class="card idea" data-s="${esc(i.symbol)}">
    <h3>${esc(i.symbol)} ${i.niche?'<span class="tag niche">niche</span>':""}<span class="tag">${i.mentions} article${i.mentions>1?"s":""}</span><span class="spacer"></span><span class="num ${cls(i.chg_5d)}" style="font-size:13px">${pct(i.chg_5d,1)} 5 j</span></h3>
    <div class="muted" style="font-size:12px">Score ${nf(i.score,1)} · ton ${nf(i.sentiment,2)} · ${px(i.price)} $ · ${nf((i.adv_usd||0)/1e6,0)} M$/j · tendance ${esc(i.trend)}</div>
    ${i.why?`<p>${esc(i.why)}</p><p class="warn" style="font-size:12px">⚠ ${esc(i.risk||"")}</p>`:""}
    <ul class="heads">${(i.headlines||[]).slice(0,3).map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`).join("")||'<p class="note">Pas encore d\'idées : elles sont calculées par le cycle IA.</p>'}</div>`;
  el.querySelectorAll(".idea").forEach(c=>c.onclick=()=>openAsset(c.dataset.s));
},
activity(el){
  const a=D.activity||{};
  el.innerHTML=`<h2>Activité réelle du compte papier</h2><div class="grid kpis">
   ${kpi("Trades clôturés",a.trades??"—",`${nf(a.per_month,1)} par mois`)}${kpi("Taux de réussite",isNum(a.win_rate)?a.win_rate+" %":"—")}
   ${kpi("Gain moyen",money(a.avg_win),"","up")}${kpi("Perte moyenne",money(a.avg_loss),"","down")}
   ${kpi("Profit factor",nf(a.profit_factor),"gains ÷ pertes")}${kpi("Réalisé (fonds)",money(a.realized),"",cls(a.realized))}
   ${kpi("Réalisé (poche IA)",money(a.ai_realized),isNum(a.ai_win_rate)?`réussite ${nf(a.ai_win_rate*100,0)} %`:"",cls(a.ai_realized))}</div>
  <h2>Historique des trades du fonds</h2><div id="ac-f"></div><h2>Trades clôturés de la poche IA</h2><div id="ac-a"></div>`;
  table($("#ac-f",el),[{t:"Actif",k:"symbol",f:r=>`<span class="sym">${esc(r.symbol)}</span>`},{t:"Stratégie",k:"strategy"},{t:"Entrée",k:"entry_date"},{t:"Sortie",k:"exit_date"},
    {t:"Prix entrée",k:"entry",n:1,f:r=>px(r.entry)},{t:"Prix sortie",k:"exit",n:1,f:r=>px(r.exit)},{t:"P&L",k:"pnl",n:1,f:r=>`<span class="${cls(r.pnl)}">${money(r.pnl)}</span>`},
    {t:"%",k:"pnl_pct",n:1,f:r=>sp(r.pnl_pct)},{t:"Raison",k:"reason"}], a.history||[], r=>openAsset(r.symbol));
  table($("#ac-a",el),[{t:"Actif",k:"underlying"},{t:"Stratégie",k:"strategy"},{t:"Ouvert",k:"opened_at",f:r=>esc(String(r.opened_at||"").slice(0,10))},
    {t:"Fermé",k:"closed_at",f:r=>esc(String(r.closed_at||"").slice(0,10))},{t:"P&L",k:"pnl",n:1,f:r=>`<span class="${cls(r.pnl)}">${money(r.pnl)}</span>`},{t:"Raison",k:"close_reason"}], a.ai_closed||[]);
},
fact(el){
  const f=D.factsheet||{}, b=D.backtest;
  el.innerHTML=`<h2>Simulation de la stratégie sur données réelles (base 100)</h2><div class="card"><div id="fs-c"></div>
   <p class="note">Brut = avant frais. Net = après ${nf((f.mgmt||0)*100,0)} % de frais de gestion et ${nf((f.perf||0)*100,0)} % de commission sur les gains (au-dessus du plus haut). ${esc(f.activity||"")}</p></div>
   <div class="grid half" style="margin-top:12px"><div class="card"><h2 style="margin-top:0">Indicateurs</h2><div id="fs-t"></div></div>
   <div class="card" style="overflow-x:auto"><h2 style="margin-top:0">Rendements mensuels nets (%)</h2><div class="mth">${D.monthly_html||""}</div></div></div>`;
  if(b) lineChart($("#fs-c",el),{x:b.d,series:[{name:"Brut",data:b.gross,color:"#5eb1ff",w:2},{name:"Net de frais",data:b.net,color:"#34d399",w:2},...(b.spy?[{name:"S&P 500",data:b.spy,color:"#8b98a7",dash:true}]:[])],h:300,fmt:v=>nf(v,0)});
  const g=f.gross_rows||[], n=f.net_rows||[];
  $("#fs-t",el).innerHTML=`<div class="tbl"><table><tr><th>Indicateur</th><th class="n">Brut</th><th class="n">Net</th></tr>${g.map((r,i)=>`<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td><td class="n">${esc((n[i]||[])[1])}</td></tr>`).join("")}</table></div>`;
  el.querySelectorAll(".mth table").forEach(t=>{t.style.fontSize="12px"; t.querySelectorAll("td,th").forEach(c=>{c.style.padding="5px 7px"; if(c.textContent.trim()==="NaN") c.textContent=""; const v=parseFloat(c.textContent); if(c.tagName==="TD"&&isFinite(v)) c.className="n "+cls(v);});});
},
context(el){
  const g=D.gauge||{};
  el.innerHTML=`<h2>Climat de marché</h2><div class="grid kpis">
   ${kpi("Risque (filtre VIX)", esc((g.level||"—").toUpperCase()), esc(g.note||""), g.level==="risk-off"?"down":g.level==="prudence"?"warn":"")}
   ${kpi("VIX", nf(g.vix,1), isNum(g.vix_pct)?`${Math.round(g.vix_pct*100)}e percentile sur 2 ans`:"")}
   ${kpi("Or sur 1 mois", pct(isNum(g.gold_1m)?g.gold_1m*100:null,1), "", cls(g.gold_1m))}
   ${kpi("Pétrole sur 1 mois", pct(isNum(g.oil_1m)?g.oil_1m*100:null,1), "", cls(g.oil_1m))}</div>
  <h2>Macro</h2><div class="grid kpis">${(D.macro||[]).map(m=>`<div class="card kpi"><div class="l">${esc(m.label)}</div><div class="v">${px(m.last)}</div>
   <div class="s">${sp(m.chg_1d)} jour · ${sp(m.chg_1m,1)} mois</div>${spark(m.spark, (m.chg_1m||0)>=0?"#34d399":"#f87171")}</div>`).join("")}</div>
  <h2>Derniers titres de la presse financière</h2><div class="card">${(D.headlines||[]).map(h=>`<div class="row"><span>${esc(h)}</span></div>`).join("")||'<p class="note">Indisponible dans ce run.</p>'}</div>`;
},
};

function posTable(el, rows){
  table(el,[{t:"Actif",k:"symbol",f:r=>`<span class="sym">${esc(r.symbol)}</span>`},{t:"Classe",k:"asset_class",f:r=>`<span class="muted">${esc(r.sector)}</span>`},
    {t:"Stratégie",k:"strategy",f:r=>`<span class="tag">${esc(r.strategy)}</span>`},{t:"Poids",k:"weight",n:1,f:r=>pct(r.weight,1,false)},
    {t:"Valeur",k:"value",n:1,f:r=>money(r.value)},{t:"Prix entrée",k:"entry",n:1,f:r=>px(r.entry)},{t:"Prix actuel",k:"price",n:1,f:r=>px(r.price)},
    {t:"P&L",k:"pnl",n:1,f:r=>`<span class="${cls(r.pnl)}">${money(r.pnl)}</span>`},{t:"%",k:"pnl_pct",n:1,f:r=>sp(r.pnl_pct)},
    {t:"Stop",k:"stop",n:1,f:r=>px(r.stop)},{t:"Distance stop",k:"to_stop_pct",n:1,f:r=>`<span class="${r.to_stop_pct>-2?"warn":""}">${pct(r.to_stop_pct)}</span>`},
    {t:"Risque",k:"risk_usd",n:1,f:r=>money(r.risk_usd)},{t:"Jours",k:"days",n:1}], rows, r=>openAsset(r.symbol));
}

// ───────── fiche d'un actif ─────────
function openAsset(sym){
  const a=ASSETS[sym], p=POS[sym], box=$("#mbox");
  if(!a){ box.innerHTML=`<div class="mhead"><h2>${esc(sym)}</h2><button class="x" onclick="closeM()">×</button></div><p class="note">Pas de données de marché pour cet actif dans ce run.</p>`; $("#modal").classList.add("on"); return; }
  const v0=vol(a), crypto=a.asset_class==="Crypto";
  box.innerHTML=`<div class="mhead"><div><h2>${esc(a.symbol)} <span class="num" style="font-size:18px">${px(a.price)}</span> ${sp(a.chg_1d)}</h2>
     <div class="muted" style="margin-top:4px">${esc(a.name||a.sector)} · ${esc(a.asset_class)} ${a.groups.map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div></div><button class="x" onclick="closeM()" aria-label="Fermer">×</button></div>
   <div class="card" style="margin-top:12px"><div id="m-chart"></div></div>
   <div class="grid mgrid" style="margin-top:12px">
    <div>
     <div class="stats">
      <div><small>5 jours</small><b class="${cls(a.chg_5d)}">${pct(a.chg_5d,1)}</b></div><div><small>1 mois</small><b class="${cls(a.chg_1m)}">${pct(a.chg_1m,1)}</b></div>
      <div><small>3 mois</small><b class="${cls(a.chg_3m)}">${pct(a.chg_3m,1)}</b></div><div><small>1 an</small><b class="${cls(a.chg_1y)}">${pct(a.chg_1y,1)}</b></div>
      <div><small>RSI 14</small><b>${nf(a.rsi,0)}</b></div><div><small>Tendance</small><b class="${a.trend==="haussière"?"up":a.trend==="baissière"?"down":""}">${esc(a.trend)}</b></div>
      <div><small>Vol réalisée 20 j</small><b>${pct(a.hv*100,1,false)}</b></div><div><small>Vol réalisée 60 j</small><b>${pct((a.hv60||0)*100,1,false)}</b></div>
      <div><small>Vol implicite</small><b>${a.iv?pct(a.iv*100,1,false):"—"}</b></div><div><small>IV / HV</small><b class="${a.iv&&a.iv/a.hv>1.3?"warn":""}">${a.iv?nf(a.iv/a.hv,2):"—"}</b></div>
      <div><small>ATR (jour)</small><b>${pct(a.atr_pct,2,false)}</b></div><div><small>Vs plus haut 1 an</small><b class="${cls(a.from_high)}">${pct(a.from_high,1)}</b></div>
      <div><small>Volume / jour</small><b>${isNum(a.adv_musd)?nf(a.adv_musd,0)+" M$":"—"}</b></div><div><small>Résultats</small><b class="${isNum(a.earnings)&&a.earnings<=7?"warn":""}">${isNum(a.earnings)?"dans "+a.earnings+" j":"—"}</b></div>
     </div>
     ${p?`<h2>Position du fonds</h2><div class="stats"><div><small>Valeur</small><b>${money(p.value)}</b></div><div><small>P&L</small><b class="${cls(p.pnl)}">${money(p.pnl)} (${pct(p.pnl_pct,1)})</b></div><div><small>Stop</small><b>${px(p.stop)} (${pct(p.to_stop_pct,1)})</b></div><div><small>Stratégie</small><b>${esc(p.strategy)}</b></div></div>`:""}
     <h2>Ce que disent les stratégies du fonds</h2>
     <div class="card">${(a.signals||[]).map(s=>`<div class="row"><span>${esc(s.name)}</span><span class="tag ${s.state==="ACHAT"?"buy":s.state==="SORTIE"?"sell":""}">${esc(s.state)}</span></div>`).join("")||'<p class="note">Historique trop court pour les signaux.</p>'}
      <p class="note">ACHAT = signal d'entrée aujourd'hui. Le fonds n'achète que les actifs de son univers testé et si la limite de positions le permet.</p></div>
     ${a.idea?`<h2>Idée presse</h2><div class="card"><div class="muted" style="font-size:12px">Score ${nf(a.idea.score,1)} · ${a.idea.mentions} articles · ton ${nf(a.idea.sentiment,2)} ${a.idea.niche?'<span class="tag niche">niche</span>':""}</div>${a.idea.why?`<p>${esc(a.idea.why)}</p><p class="warn" style="font-size:12px">⚠ ${esc(a.idea.risk||"")}</p>`:""}</div>`:""}
     <h2>Actualité</h2><div class="card">${(a.news||[]).map(h=>`<div class="row"><span>${esc(h)}</span></div>`).join("")||'<p class="note">Pas de titre récent.</p>'}</div>
    </div>
    <div class="card calc"><h2 style="margin-top:0">Calculateur d'options (Black-Scholes)</h2>
     ${crypto?'<p class="note">Pas d\'options crypto sur Alpaca : calcul théorique.</p>':""}
     <label>Strike <span class="val" id="c-kv"></span></label><input type="range" id="c-k" min="70" max="130" step="1" value="100">
     <label>Jours avant échéance <span class="val" id="c-tv"></span></label><input type="range" id="c-t" min="1" max="365" step="1" value="30">
     <label>Volatilité <span class="val" id="c-vv"></span></label><input type="range" id="c-v" min="5" max="200" step="0.5" value="${(v0*100).toFixed(1)}">
     <p class="note" style="margin-top:4px">Vol de départ : ${esc(a.vol_source)} (${pct(v0*100,1,false)}). Taux sans risque ${nf(D.risk_free*100,1)} %.</p>
     <div id="c-out"></div></div>
   </div>`;
  const ch=a.chart, hl=[]; if(p){ hl.push({y:p.entry,label:"entrée",color:"#5eb1ff"}); if(p.stop) hl.push({y:p.stop,label:"stop",color:"#f87171"}); }
  $("#modal").classList.add("on"); document.body.style.overflow="hidden";
  lineChart($("#m-chart"),{x:ch.d,series:[{name:"Cours",data:ch.c,color:"#e6edf3",w:2,fill:true},{name:"Moyenne 20 j",data:ch.e20,color:"#5eb1ff"},{name:"Moyenne 50 j",data:ch.e50,color:"#fbbf24"}],hlines:hl,h:280,fmt:px});
  const calc=()=>{ const S=a.price, K=S*(+$("#c-k").value)/100, days=+$("#c-t").value, v=+$("#c-v").value/100, T=days/365, r=D.risk_free;
    $("#c-kv").textContent=`${px(K)} (${$("#c-k").value} %)`; $("#c-tv").textContent=days+" j"; $("#c-vv").textContent=nf(v*100,1)+" %";
    const c=bs(S,K,T,r,v,"call"), q=bs(S,K,T,r,v,"put"), str=c.price+q.price;
    const line=(l,x,y,d=2)=>`<tr><td>${l}</td><td class="n">${nf(x,d)}</td><td class="n">${nf(y,d)}</td></tr>`;
    $("#c-out").innerHTML=`<div class="tbl" style="margin-top:10px"><table><tr><th></th><th class="n">Call</th><th class="n">Put</th></tr>
      ${line("Prix (par action)",c.price,q.price)}${line("Prix d'un contrat (×100)",c.price*100,q.price*100,0)}
      ${line("Delta",c.delta,q.delta,3)}${line("Gamma",c.gamma,q.gamma,4)}${line("Vega (par pt de vol)",c.vega,q.vega,3)}
      ${line("Theta (par jour)",c.theta,q.theta,3)}${line("Rho (par pt de taux)",c.rho,q.rho,3)}${line("Proba. de finir gagnant au strike",c.itm*100,q.itm*100,0)}</table></div>
      <div class="stats" style="margin-top:10px"><div><small>Straddle (call + put)</small><b>${px(str)} $</b></div>
       <div><small>Points morts</small><b>${px(K-str)} / ${px(K+str)}</b></div><div><small>Mouvement attendu</small><b>± ${nf(str/S*100,1)} %</b></div>
       <div><small>Parité C − P</small><b>${nf(c.price-q.price,2)}</b><small>= S − K·e^(−rT) = ${nf(S-K*Math.exp(-r*T),2)}</small></div></div>`; };
  ["#c-k","#c-t","#c-v"].forEach(s=>$(s).oninput=calc); calc();
}
function closeM(){ $("#modal").classList.remove("on"); document.body.style.overflow=""; }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeM(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeM(); });

// ───────── démarrage ─────────
$("#p-time").innerHTML=`Mis à jour <b>${esc(D.generated_at)}</b>`;
$("#p-vix").innerHTML=`Risque <b class="${D.gauge.level==="risk-off"?"down":D.gauge.level==="prudence"?"warn":"up"}">${esc((D.gauge.level||"—").toUpperCase())}</b> · VIX ${nf(D.gauge.vix,1)}`;
$("#p-cycle").innerHTML=`Dernier cycle <b>${esc((D.overview.last_cycle||"—").replace("T"," "))}</b>`;
$("#tabs").innerHTML=TABS.map(([id,l])=>`<button data-t="${id}">${l}</button>`).join("");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
let start=(location.hash||"").slice(1); try{ if(!RENDER[start]) start=localStorage.getItem("tab"); }catch(e){}
show(RENDER[start]?start:"overview");
</script>
</body>
</html>
